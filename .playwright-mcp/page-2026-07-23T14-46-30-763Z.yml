  - generic [ref=f4e221]: The mix that works
  - article [ref=f4e224]:
    - heading "Stop picking one. Run both." [level=2] [ref=f4e225]
    - paragraph [ref=f4e226]: The developers I see spending the most are trying to find the single best model and use it for everything. The ones with the leanest bills use different models for different steps in the same workflow — deliberately, based on what each step actually requires.
    - paragraph [ref=f4e227]: "Here's the workflow pattern that covers most coding agent scenarios:"
  - generic [ref=f4e229]:
    - generic [ref=f4e230]:
      - generic [ref=f4e231]: orchestration & planning
      - generic [ref=f4e235]:
        - generic [ref=f4e236]: Task understanding & plan
        - generic [ref=f4e237]: Claude Sonnet 5 or o4-mini
        - generic [ref=f4e238]: Decompose the task, identify unknowns, plan subtasks. Sonnet if it's a code problem; o4-mini if it requires algorithmic reasoning before any code is touched.
    - generic [ref=f4e239]:
      - generic [ref=f4e240]: retrieval
      - generic [ref=f4e244]:
        - generic [ref=f4e245]: Explore codebase, find relevant files
        - generic [ref=f4e246]: Claude Haiku 4.5
        - generic [ref=f4e247]: Read-only navigation. 200K context handles even large repos. 15× cheaper than Opus for identical file-search results. Zero tool-calling failures in benchmark testing.
    - generic [ref=f4e248]:
      - generic [ref=f4e249]: implementation
      - generic [ref=f4e253]:
        - generic [ref=f4e254]: Write & edit code
        - generic [ref=f4e255]: Claude Sonnet 5
        - generic [ref=f4e256]: "Best SWE-bench score available. Instruction-following on large codebases is the defining strength. For pure math / algorithm design embedded in code: hand off to o4-mini for that subtask."
    - generic [ref=f4e257]:
      - generic [ref=f4e258]: verification
      - generic [ref=f4e262]:
        - generic [ref=f4e263]: Review, test generation, sanity check
        - generic [ref=f4e264]: Claude Haiku 4.5 or Sonnet 5
        - generic [ref=f4e265]: Haiku for mechanical checks (does this compile, are these tests structurally correct). Sonnet for semantic review (does this actually do the right thing).
    - generic [ref=f4e266]:
      - generic [ref=f4e267]: hard reasoning (if needed)
      - generic [ref=f4e270]:
        - generic [ref=f4e271]: Algorithm design, proof, optimisation
        - generic [ref=f4e272]: o3 or o4-mini
        - generic [ref=f4e273]: Reach for o3 only when the problem is genuinely hard reasoning — NP-hard scheduling, mathematical proofs, complex constraint satisfaction. For everything else in this slot, o4-mini costs 45% less and is nearly as capable.
  - article [ref=f4e274]:
    - paragraph [ref=f4e275]: This isn't theoretical. In a workflow with 20 subagent calls, routing the 12 navigation/search calls to Haiku and the 3 hard-reasoning calls to o4-mini can cut total subagent costs by 70–80% compared to running everything on Sonnet or Opus. The implementation calls stay on Sonnet, where they belong.
  - generic [ref=f4e276]: The config pattern
  - article [ref=f4e279]:
    - heading "Bake the decision into your config. Stop making it per-session." [level=2] [ref=f4e280]
    - paragraph [ref=f4e281]:
      - text: "Here's the thing about model selection that nobody talks about:"
      - strong [ref=f4e282]: it's a decision that should be made once, not on every task
      - text: . The model that's right for file navigation is always the model that's right for file navigation. It doesn't change session to session. So why are you choosing it manually each time?
    - paragraph [ref=f4e283]:
      - text: Both Claude Code skills and agent config files accept a
      - code [ref=f4e284]: model
      - text: field. Set it once. Every invocation of that skill or agent uses the right model automatically, with no thought required from you or the person running the session.
    - heading "In Claude Code skill files" [level=3] [ref=f4e285]
    - paragraph [ref=f4e286]:
      - text: Any skill in
      - code [ref=f4e287]: .claude/skills/
      - text: or
      - code [ref=f4e288]: ~/.claude/skills/
      - text: "can declare its model in frontmatter. The skill loads with that model pinned — the session model doesn't matter:"
  - generic [ref=f4e289]:
    - generic [ref=f4e290]:
      - generic [ref=f4e291]: .claude/skills/explore/SKILL.md
      - generic [ref=f4e295]: "# Read-only codebase navigation # Always runs on Haiku — never inherits session model --- model: claude-haiku-4-5 effort: low description: Search the codebase, read files, find symbols and definitions. Read-only — never modify anything. --- You are a read-only research agent. Use grep, file reads, and symbol search. Return findings as structured lists."
    - generic [ref=f4e296]:
      - generic [ref=f4e297]: .claude/skills/reason/SKILL.md
      - generic [ref=f4e301]: "# Hard reasoning — algorithm design, proofs # Routes to o4-mini via OpenAI-compatible endpoint --- model: o4-mini effort: high description: Deep reasoning for algorithm design, complexity analysis, and hard optimisation problems. --- Work through this step by step. Show your reasoning before the answer. Return: approach, complexity, code sketch."
  - paragraph [ref=f4e302]: Two skills — two models — zero per-session decisions
  - article [ref=f4e303]:
    - heading "In agent definition files" [level=3] [ref=f4e304]
    - paragraph [ref=f4e305]:
      - text: Subagents defined in
      - code [ref=f4e306]: .claude/agents/
      - text: work the same way. The
      - code [ref=f4e307]: model
      - text: "field pins the model for every invocation of that agent, regardless of what the parent session is running on:"
  - generic [ref=f4e308]:
    - generic [ref=f4e309]:
      - generic [ref=f4e310]: .claude/agents/implement.md
      - generic [ref=f4e314]: "--- name: implement model: claude-sonnet-5 description: Writes and edits code. Handles large codebases. Do not use for pure math or file search. tools: - Read - Edit - Write - Bash --- Implement the requested change. Follow existing patterns in the codebase. Do not refactor beyond the task scope."
    - generic [ref=f4e315]:
      - generic [ref=f4e316]: .claude/agents/plan.md
      - generic [ref=f4e320]: "--- name: plan model: o4-mini description: Task planning and decomposition. Breaks complex problems into concrete subtasks with clear scope. tools: - Read --- Decompose this task into subtasks. Flag any ambiguities before planning. Output: numbered list, each with acceptance criteria and model hint."
  - paragraph [ref=f4e321]: Agent files pin the model — subagents never inherit by accident
  - article [ref=f4e322]:
    - paragraph [ref=f4e323]: "The \"model hint\" in the plan agent's output is worth noting — it's a pattern where the planning step explicitly annotates each subtask with the model it should run on. If the plan says \"Task 3: implement binary search tree — Sonnet\" and \"Task 4: prove worst-case complexity — o4-mini\", the orchestrator routes accordingly without any human judgment at execution time."
    - generic [ref=f4e324]:
      - strong [ref=f4e325]: "The rule I use:"
      - text: If I'm writing a skill or agent and I can't immediately answer "which model should run this?", that's a sign the skill does too many things. Split it. Each agent should have exactly one kind of work, and that work should have an obvious model fit.
    - heading "What about the session default?" [level=3] [ref=f4e326]
    - paragraph [ref=f4e327]: On a Claude Code Max subscription, the default session model is Opus. Which means if you've defined zero subagent model overrides, every file read, every grep, every test run is being billed at Opus rates — $15/M input — for work that Haiku handles identically at $0.80/M.
    - paragraph [ref=f4e328]:
      - text: "The fix is three files: an"
      - code [ref=f4e329]: explore
      - text: agent set to Haiku, an
      - code [ref=f4e330]: implement
      - text: agent set to Sonnet 5, and a
      - code [ref=f4e331]: plan
      - text: agent set to whatever your planning work warrants. Opus stays in the session default for the conversations where it earns its rate — the complex discussions, the architectural decisions, the cases where you actually want the best model thinking about the problem.
    - paragraph [ref=f4e332]: Running everything on Opus is the AI equivalent of sending every company email via FedEx overnight because sometimes you send contracts. The routing exists for a reason.
  - generic [ref=f4e333]: The nuance
  - article [ref=f4e336]:
    - heading "When the tidy mental model breaks down" [level=2] [ref=f4e337]
    - paragraph [ref=f4e338]: I want to be honest about where this gets complicated, because the "use Haiku for navigation, Sonnet for coding, o3 for math" framework is a simplification.
    - paragraph [ref=f4e339]:
      - strong [ref=f4e340]: The o-series latency is real.
      - text: o3 takes 30–60 seconds to respond. If you've built a workflow where an o3 call is in the critical path — something the user is waiting on — that's a bad experience even if the answer is excellent. Use o4-mini instead for planning steps. Reserve o3 for genuinely hard, fully asynchronous reasoning jobs where the extra depth matters and latency doesn't.
    - paragraph [ref=f4e341]:
      - strong [ref=f4e342]: Haiku's output limit bites on certain tasks.
      - text: Haiku 4.5 has an 8,192-token output limit. GPT-4o mini caps at 16,384. If you're generating a large file, a long test suite, or multi-section documentation in a single call, Haiku might truncate. Either use Sonnet for that specific task or break the output into multiple calls.
    - paragraph [ref=f4e343]:
      - strong [ref=f4e344]: OpenAI's ecosystem integrations are broader.
      - text: If you're already deep in the OpenAI ecosystem — function calling conventions, fine-tuned models, Azure OpenAI Service, specific third-party tools that only support OpenAI — the switching cost is real. GPT-4o is an excellent model for most tasks, and the Claude-vs-OpenAI decision is much less important than "which model for which task within whatever you're using."
    - paragraph [ref=f4e345]:
      - strong [ref=f4e346]: Benchmark gaming is a real problem.
      - text: Both companies have been caught, or credibly accused, of optimising for benchmark scenarios. SWE-bench is more representative than most, but "82.1% on SWE-bench" is not the same as "82.1% of your real tasks done correctly." Test on your actual workload before committing to a model for production use.
    - generic [ref=f4e347]:
      - strong [ref=f4e348]: "The honest default:"
      - text: If you're building a net-new coding agent workflow today and don't have strong reasons to do otherwise — Claude Sonnet 5 for implementation, Claude Haiku 4.5 for retrieval, o4-mini for hard reasoning steps. Revisit when benchmarks shift, which they will.
  - generic [ref=f4e350]:
    - heading "The decision that doesn't need to be a decision." [level=2] [ref=f4e351]
    - paragraph [ref=f4e352]: You probably have a preferred model right now. It's probably whatever you were using when you first got serious about AI coding tools. That's fine — defaults exist for a reason. But the gap between "one model for everything" and "right model for each task type, baked into config" is where a meaningful chunk of your AI bill is hiding.
    - paragraph [ref=f4e353]:
      - text: "The config pattern takes an afternoon. Three agent files, three model declarations, done. After that, every session routes automatically: Haiku navigates, Sonnet builds, the reasoning agent reasons."
      - strong [ref=f4e354]: You stop spending mental energy on model selection, and you stop accidentally billing Opus rates for grep.
    - paragraph [ref=f4e355]: "The models will keep improving. The pattern stays the same: know what each step of your workflow actually requires, match the model to the requirement, put it in config, and move on to the work that actually matters."
